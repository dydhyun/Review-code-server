name: Review Test

on:
  push:
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Save Review Data
        run: |
          {
            echo "DIFF<<EOF"
            git diff HEAD~1 HEAD
            echo "EOF"

            echo "COMMIT_MESSAGE<<EOF"
            git log -1 --pretty=%B
            echo "EOF"

            echo "AUTHOR=${{ github.actor }}"
            echo "REPOSITORY=${{ github.repository }}"
          } >> $GITHUB_ENV

      - name: Create payload
        run: |
          cat <<EOF > payload.json
          {
            "diff": $(jq -Rs . <<< "$DIFF"),
            "author": "$AUTHOR",
            "repository": "$REPOSITORY",
            "commitMessage": $(jq -Rs . <<< "$COMMIT_MESSAGE")
          }
          EOF

          cat payload.json

      - name: Send Review Request
        run: |
          curl -X POST \
            "${{ secrets.REVIEW_API_URL }}" \
            -H "Authorization: Bearer ${{ secrets.REVIEW_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data @payload.json