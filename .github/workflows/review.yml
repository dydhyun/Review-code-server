name: Review Test

on:
  push:
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Git History
        run: |
          git log --oneline -n 5

      - name: Print Diff
        run: |
          git diff HEAD~1 HEAD
          
