name: Review Test

on:
  push:
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Git History
        run: |
          git log --oneline -n 5

      - name: Save Diff
        run: |
          {
            echo "DIFF<<EOF"
            git diff HEAD~1 HEAD
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Check Saved Diff
        run: |
          echo "$DIFF"

      - name: Review With OpenAI
        run: |
          curl https://api.openai.com/v1/responses \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "model": "gpt-5-mini",
            "input": "시니어 백엔드 개발자 관점으로 다음 변경사항을 리뷰해봐.\n\n$DIFF"
          }
          EOF