name: Review Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Save Review Data
        if: github.event_name == 'push'
        run: |
          {
            echo "DIFF<<EOF"
            git diff HEAD~1 HEAD \
              -- '*.java' \
              ':(exclude)src/test/**'
            echo "EOF"

            echo "COMMIT_MESSAGE<<EOF"
            git log -1 --pretty=%B
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create payload
        if: github.event_name == 'push'
        run: |
          jq -n \
          --arg diff "$DIFF" \
          --arg author "${{ github.actor }}" \
          --arg repository "${{ github.repository }}" \
          --arg commitMessage "$COMMIT_MESSAGE" \
          --arg runId "${{ github.run_id }}" \
          --arg commitId "${{ github.sha }}" \
          '{
            diff: $diff,
            author: $author,
            repository: $repository,
            commitMessage: $commitMessage,
            runId: $runId,
            commitId: $commitId
          }' > payload.json

          cat payload.json

      - name: Send Review Request
        if: github.event_name == 'push'
        run: |
          curl --fail -X POST \
            "${{ secrets.REVIEW_API_URL }}/reviews" \
            -H "Authorization: Bearer ${{ secrets.REVIEW_API_KEY }}" \
            -H "X-Repository: ${{ github.repository}}" \
            -H "Content-Type: application/json" \
            --data @payload.json

      - name: Send Embedding Requests for Changed Files
        if: github.event_name == 'push'
        run: |
          for file in $(git diff --name-only HEAD~1 HEAD -- '*.java' ':(exclude)src/test/**'); do
            if [ -f "$file" ]; then
              jq -n \
                --arg repoName "${{ github.repository }}" \
                --arg filePath "$file" \
                --arg content "$(cat "$file")" \
                '{repoName: $repoName, filePath: $filePath, content: $content}' > embedding_payload.json

              curl --fail -X POST \
                "${{ secrets.REVIEW_API_URL }}/index" \
                -H "Authorization: Bearer ${{ secrets.REVIEW_API_KEY }}" \
                -H "Content-Type: application/json" \
                --data @embedding_payload.json
            fi
          done
        
      - name: Full index on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          find src/main -name "*.java" | while read -r file; do
            jq -n \
              --arg repoName "${{ github.repository }}" \
              --arg filePath "$file" \
              --arg content "$(cat "$file")" \
              '{repoName: $repoName, filePath: $filePath, content: $content}' > index_payload.json

            curl --fail -X POST \
              "${{ secrets.REVIEW_API_URL }}/index" \
              -H "Authorization: Bearer ${{ secrets.REVIEW_API_KEY }}" \
              -H "Content-Type: application/json" \
              --data @index_payload.json
          done