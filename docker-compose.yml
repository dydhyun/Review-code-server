services:
  redis:
    image: redis:7.2-alpine
    container_name: review-server-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: review-server-postgres
    environment:
      POSTGRES_DB: reviewcodeserver
      POSTGRES_USER: reviewuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis-data:
  pg-data: